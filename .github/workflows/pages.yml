name: Deploy dashboard to GitHub Pages

# Deploys the whole repo checkout as the Pages site root, not just
# dashboard/ — dashboard/index.html reads its CSVs via repo-root-relative
# paths (../bench/results.csv, ../fuzz/differential_history.csv,
# ../docs/devlog-orderbook-vs-ladderbook.md) so it can be served identically
# with a plain `python3 -m http.server` from the repo root (see
# dashboard/README.md) or from Pages, with no path rewriting either way.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel one that's already
# writing to the live site mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
